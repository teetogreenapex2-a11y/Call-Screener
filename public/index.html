<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>Call Screener</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--text:#f1f5f9;--mute:#94a3b8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 40px}
main{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:20px 0 4px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:26px 0 8px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:54px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:.2s}
.switch span:before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:before{transform:translateX(24px)}
button,.btn{font:inherit;color:var(--text);background:var(--blue);border:0;border-radius:10px;padding:11px 14px;margin:6px 8px 0 0}
button.alt{background:var(--line)}
input[type=tel],input[type=password]{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.call .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute)}
.call .sum{margin:4px 0 0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;margin-right:6px;color:#0f172a}
.o-answered,.o-voicemail{background:var(--green)}.o-missed{background:var(--amber)}.o-blocked{background:var(--red)}
.quote{margin:8px 0 0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:15px}
audio{width:100%;margin-top:8px}
#msg{min-height:20px;color:var(--mute);font-size:14px;margin-top:8px}
.empty{color:var(--mute);text-align:center;padding:18px}
#login{margin-top:40px}
</style>
</head>
<body>
<main>
  <section id="login" hidden>
    <h1>Call Screener</h1>
    <p class="sub">Enter your ADMIN_KEY to open the app. It stays on this phone.</p>
    <input type="password" id="k" placeholder="ADMIN_KEY" autocomplete="current-password">
    <button id="enter">Open</button>
    <div id="lmsg" class="sub"></div>
  </section>

  <section id="app" hidden>
    <h1>Call Screener</h1>
    <div class="sub" id="status"></div>

    <h2>Voicemail</h2>
    <div class="card row">
      <div><div>Take voicemail</div><div class="sub" id="vmsub"></div></div>
      <label class="switch"><input type="checkbox" id="vm"><span></span></label>
    </div>

    <h2>Ring-through contacts</h2>
    <div class="card">
      <div><b id="cn">0</b> numbers ring your phone directly, with no screening.</div>
      <button id="pick" hidden>Import from phone contacts</button>
      <button class="alt" id="filebtn">Load .vcf / .csv file</button>
      <input type="file" id="file" accept=".vcf,.csv,.txt" hidden>
      <div style="margin-top:10px"><input type="tel" id="num" placeholder="Add one number, e.g. 919 555 1234"></div>
      <button id="add">Add number</button>
      <button class="alt" id="rem">Remove number</button>
      <div id="msg"></div>
    </div>

    <h2>Recent calls</h2>
    <div id="calls"></div>
    <button class="alt" id="refresh">Refresh</button>
    <button class="alt" id="signout">Sign out</button>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = '';
  try { KEY = localStorage.getItem('adminKey') || ''; } catch (e) {}
  var qs = new URLSearchParams(location.search);
  if (qs.get('key')) { KEY = qs.get('key'); try { localStorage.setItem('adminKey', KEY); } catch (e) {} history.replaceState(null, '', '/'); }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});

  function api(body) {
    return fetch('/api/app', {
      method: body ? 'POST' : 'GET',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.status === 403 ? { forbidden: true } : r.json(); });
  }

  function say(s) { $('msg').textContent = s || ''; }

  function ago(t) {
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60);
    if (h < 24) return h + ' h ago';
    return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function nice(n) {
    var d = String(n || '').replace(/\D/g, '').slice(-10);
    return d.length === 10 ? '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6) : (n || 'Unknown');
  }

  var LABEL = { answered: 'Answered', missed: 'Missed', blocked: 'Blocked', voicemail: 'Voicemail' };

  function render(d) {
    if (d.forbidden) { show('login'); $('lmsg').textContent = 'That key was not accepted.'; return; }
    if (d.error) { $('status').textContent = d.error; return; }
    show('app');
    $('vm').checked = d.voicemail;
    $('vmsub').textContent = d.voicemail ? 'Callers you miss can leave a message.' : 'Callers you miss hear a polite goodbye.';
    $('cn').textContent = d.contacts;
    $('status').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    var box = $('calls'); box.textContent = '';
    if (!d.calls.length) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No calls yet. Screened calls will show up here.'; box.appendChild(e); }
    d.calls.forEach(function (c) {
      var el = document.createElement('div'); el.className = 'card call';
      var top = document.createElement('div'); top.className = 'top';
      var l = document.createElement('span'); l.textContent = nice(c.f);
      var r = document.createElement('span'); r.textContent = ago(c.t);
      top.appendChild(l); top.appendChild(r);
      var sum = document.createElement('div'); sum.className = 'sum';
      var tag = document.createElement('span'); tag.className = 'tag o-' + c.o; tag.textContent = LABEL[c.o] || c.o;
      sum.appendChild(tag);
      sum.appendChild(document.createTextNode((c.c ? '[' + c.c + '] ' : '') + (c.s || '')));
      el.appendChild(top); el.appendChild(sum);
      if (c.v) { var q = document.createElement('div'); q.className = 'quote'; q.textContent = c.v; el.appendChild(q); }
      if (c.l && c.l.indexOf('https://') === 0) { var a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = c.l; el.appendChild(a); }
      box.appendChild(el);
    });
  }

  function show(which) { $('login').hidden = which !== 'login'; $('app').hidden = which !== 'app'; }
  function load() { return api().then(render).catch(function () { $('status').textContent = 'Offline. Try again.'; }); }

  function act(body, okMsg) {
    say('Saving...');
    return api(body).then(function (d) { render(d); say(d.error ? d.error : okMsg); }).catch(function () { say('Could not save. Try again.'); });
  }

  function extract(txt) {
    var src = txt;
    if (/BEGIN:VCARD/i.test(txt)) src = txt.split(/\r?\n/).filter(function (l) { return /^(item\d+\.)?TEL/i.test(l); }).join('\n');
    var m = src.match(/\+?\d[\d\s().\-]{8,18}\d/g) || [], seen = {}, out = [];
    m.forEach(function (x) { var d = x.replace(/\D/g, ''); if (d.length < 10 || d.length > 13) return; d = d.slice(-10); if (!seen[d]) { seen[d] = 1; out.push(d); } });
    return out;
  }

  $('enter').onclick = function () { KEY = $('k').value.trim(); try { localStorage.setItem('adminKey', KEY); } catch (e) {} load(); };
  $('vm').onchange = function () { act({ action: 'voicemail', on: $('vm').checked }, $('vm').checked ? 'Voicemail is on.' : 'Voicemail is off.'); };
  $('refresh').onclick = load;
  $('signout').onclick = function () { try { localStorage.removeItem('adminKey'); } catch (e) {} KEY = ''; show('login'); };
  $('add').onclick = function () { var n = $('num').value; if (extract(n).length) { act({ action: 'allow', number: n }, 'Added.'); $('num').value = ''; } else say('Enter a 10-digit number.'); };
  $('rem').onclick = function () { var n = $('num').value; if (extract(n).length) { act({ action: 'unallow', number: n }, 'Removed.'); $('num').value = ''; } else say('Enter a 10-digit number.'); };
  $('filebtn').onclick = function () { $('file').click(); };
  $('file').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { var nums = extract(String(rd.result)); if (!nums.length) return say('No numbers found in that file.'); act({ action: 'import', numbers: nums }, nums.length + ' numbers added.'); };
    rd.readAsText(f);
  };
  if (navigator.contacts && navigator.contacts.select) {
    $('pick').hidden = false;
    $('pick').onclick = function () {
      navigator.contacts.select(['tel'], { multiple: true }).then(function (list) {
        var nums = [];
        list.forEach(function (c) { (c.tel || []).forEach(function (t) { nums = nums.concat(extract(t)); }); });
        if (!nums.length) return say('No numbers selected.');
        act({ action: 'import', numbers: nums }, nums.length + ' numbers added.');
      }).catch(function () { say('Contact picker was closed.'); });
    };
  }

  if (KEY) load(); else show('login');
  setInterval(function () { if (!document.hidden && KEY && !$('app').hidden) load(); }, 30000);
})();
</script>
</body>
</html>
